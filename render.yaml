services:
  - type: web
    name: npcbook
    runtime: static
    buildCommand: python app.py && python feed_upgrade.py
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /favicon.ico
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /favicon.svg
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
